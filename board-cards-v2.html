<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>aquamx card board</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Noto+Sans+JP:wght@500;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ══ Card board v2 — canary (เปิดทีละตึกผ่าน CARDS_V2 ใน build.mjs) ══
   ต่างจาก board-cards.html: (1) หนึ่งรอบที่ขึ้นจอ = ภาษาเดียว ไม่เปลี่ยนกลางคัน
   (2) "คุ้มกว่า X%" + สถานะดีลอยู่คู่กัน (3) ไม่มีไอคอนเตียง ตัวใหญ่ขึ้น
   (4) ราคาขายโชว์ ล้านบาท + ฿/ตร.ม. นิ่ง ไม่สลับ (5) สรุป "ว่าง N ห้อง · เริ่ม X"
   ══ Card board — 9:16 playlist surface (sibling of board.html's split-flap) ══
   Same data contract as board.html (__BOARD__ / #sim= / demo).
   Safe bands match board.html: player wrapper's navy header/footer overlap
   140px top / 110px bottom — nothing critical may live there. */
:root {
  /* หมึกน้ำเงินเข้ม = พื้นหลัง · การ์ด = navy แบรนด์ (สีเดียวกับโลโก้)
     คู่นี้ทำให้การ์ดลอยขึ้นมาแบบ tonal และปล่อยให้ธงเขียว/ส้ม + ราคาบรอนซ์
     เป็นสีเดียวที่สะดุดตาบนจอ */
  --stage:  #060B14;
  --card:   #0E3361;
  --line:   rgba(255,255,255,0.16);
  --cyan:   #9BE8FF;
  --bronze: #E09A55;
  --green:  #7DE8A4;
  --orange: #FFB25E;
  --dim:    rgba(255,255,255,0.58);
}
* { box-sizing: border-box; margin: 0; }
/* หน้านี้ออกแบบตายตัวที่ 1080×1920 แล้ว "ย่อทั้งแผง" ให้พอดีกล่องที่ถูกวางไว้
   (จอจริง = พอดี 1:1 · ใน iframe ของ player หรือหน้าต่างเล็กกว่า = ย่อลงตามสัดส่วน
   ไม่ตัด ไม่ล้น) — สัดส่วนคงเดิม แบนด์ปลอดภัยบน/ล่างจึงยังตรงกับ header/footer เสมอ */
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--stage); }
.stage {
  /* กึ่งกลางด้วย fixed + translate — grid/flex centering จะ "ตกไปชิดขอบบน"
     เองอัตโนมัติเมื่อของใหญ่กว่ากล่อง (กติกา overflow alignment ของเบราว์เซอร์) */
  position: fixed; top: 50%; left: 50%;
  width: 1080px; height: 1686px;   /* ความสูง + แถบบน/ล่าง ถูก fitStage() คำนวณใหม่ตามกล่องจริง */
  transform: translate(-50%, -50%);
  transform-origin: center center;
  background: var(--stage);
  color: #fff;
  font-family: Anuphan, 'IBM Plex Sans Thai', 'Noto Sans JP', sans-serif;
  padding: 0 46px;   /* บน/ล่างมาจาก fitStage() */
  display: flex; flex-direction: column;
}

/* ── Header ── */
.bh { margin: 0 0 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
.bh .sum { font-size: 34px; font-weight: 600; color: rgba(255,255,255,0.86); margin-top: 12px; white-space: nowrap; }
.bh .sum b { color: #fff; font-weight: 700; }
.bh .side { text-align: right; white-space: nowrap; padding-bottom: 6px; }
.bh .side .upd { display: block; font-size: 20px; color: rgba(255,255,255,0.55); margin-top: 8px; letter-spacing: 0.04em; }
.unit-chip {
  float: right; margin-top: 8px;
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(155,232,255,0.12);
  border: 2px solid rgba(155,232,255,0.35);
  color: var(--cyan); border-radius: 14px;
  padding: 8px 18px; font-size: 23px; font-weight: 700;
  transition: opacity 0.4s;
}
.bh .m { font-size: 74px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.05; }
.bh .m .accent { color: var(--cyan); }
/* ชนิดห้องต่อท้าย FOR RENT/SALE — 1 สไลด์ = 1 ชนิด จึงยกมาเป็นพระเอกแทนหัวคั่นเล็ก
   ขนาดเท่า FOR RENT/SALE (เจ้าของสั่ง) อ่านเป็นพาดหัวเดียว · บรอนซ์แยกจาก RENT (ฟ้า)
   ป้ายอังกฤษคงที่ (ไม่หมุนภาษา) จึงสั้น-กว้างพอดีบรรทัดเดียว */
.bh .m .segt { color: var(--bronze); font-size: 1em; font-weight: 800; letter-spacing: 0.02em; white-space: nowrap; }
.bh .p {
  font-family: 'IBM Plex Mono', monospace; font-weight: 700;
  font-size: 26px; letter-spacing: 0.18em; color: rgba(255,255,255,0.66);
  margin-top: 8px;
}

/* ── Cards ── */
.cards { flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
/* แถบคั่น segment — บางและเงียบ ไม่แย่งสายตาจากการ์ด ใช้ตัวอักษรชุดเดียวกับ chip ด้านบน */
.seg { flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
  font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 26px;
  letter-spacing: 0.16em; color: rgba(255,255,255,0.62); padding: 2px 4px 0; }
.seg::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.16); }
.seg b { color: var(--accent); font-weight: 700; }
.c.taken { background: #2E3540; border-color: rgba(255,255,255,0.20); }
.c.taken .t, .c.taken .pr { color: rgba(255,255,255,0.58); }
.c.taken .pru { color: rgba(255,255,255,0.5); }
.seg i { font-style: normal; font-size: 20px; letter-spacing: 0.12em; color: rgba(255,255,255,0.38); }
.c {
  /* สูงคงที่เท่ากับตอนมี 7 ห้อง — ห้องน้อยกว่า 7 ก็ "ไม่ขยายกล่อง" (เจ้าของสั่ง)
     แค่เว้นที่ว่างด้านล่าง · cap = (สูงคอนเทนเนอร์ − ช่องไฟ 6×14) ÷ 7 */
  flex: 1; min-height: 0; max-height: calc((100% - 84px) / 7);
  display: flex; align-items: center; gap: 24px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 0 30px;
}
.c .nm { flex: 1; min-width: 0; }
.c .nm .t { display: flex; align-items: center; gap: 14px; font-size: 46px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
.c .nm .t .dot { color: rgba(255,255,255,0.55); font-weight: 600; }
.c .nm .t.tight { font-size: 38px; }   /* ชื่อยาว (เช่น เพนต์เฮาส์ ญี่ปุ่น) — หดแทนที่จะล้น */
/* บรรทัดสอง = "คุ้มกว่า X%" (เขียวสด อ่านได้จากไกล) + ป้ายสถานะดีล — อยู่คู่กันได้ ไม่แย่งที่ */
.c .nm .s { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 700; margin-top: 10px; white-space: nowrap; }
.c .nm .s .val { color: var(--green); }
.c .nm .s .ps { color: rgba(255,255,255,0.86); }
.st { font-size: 26px; font-weight: 700; padding: 3px 16px; border-radius: 999px; line-height: 1.25; }
/* ป้ายขนาด — เทียบห้องใหญ่สุดของชนิดเดียวกัน · คำบวกเท่านั้น (ไม่มี "ขนาดกลาง") */
.sz { font-size: 26px; font-weight: 700; padding: 1px 14px; border-radius: 999px; line-height: 1.3; }
.sz.top { background: var(--bronze); color: #2a1600; }
.sz.big { border: 2px solid rgba(224,154,85,0.8); color: #F3C08E; }
/* บรรทัดสองไม่บีบป้าย — ให้ล้นจริงแล้วไปหดฟอนต์ทั้งบรรทัดแทน (บีบแล้วข้อความในป้ายขาด) */
.c .nm .s > * { flex-shrink: 0; white-space: nowrap; }
/* แตะการ์ดได้ (เฉพาะตึกที่เปิด DATA.tap) — ลูกศร › ท้ายการ์ดห้องว่าง · ห้องปิดดีลไม่มีลูกศร = แตะไม่ได้
   การ์ดยุบนิดหน่อยตอนแตะ (player ใส่ .tap ให้ 160ms) */
.tapon #cards .c:not(.taken) { position: relative; padding-right: 64px; }
.tapon #cards .c:not(.taken)::after { content: '›'; position: absolute; right: 22px; top: 50%; transform: translateY(-52%);
  font-size: 58px; font-weight: 300; line-height: 1; color: rgba(255,255,255,0.5); }
.tapon #cards .c.tap { transform: scale(0.985); background: #16457f; transition: transform .12s, background-color .12s; }
/* บรรทัดของตัวเองใต้สรุป — ต่อท้ายสรุปแล้วบอร์ดขายภาษาไทยล้นชนป้ายภาษา (พบ 13 ต.ค.) */
.bh .taphint { display: block; margin-top: 8px; font-size: 32px; color: var(--cyan); font-weight: 700; white-space: nowrap; }
.bh .taphint[hidden] { display: none; }   /* ตึกที่ไม่เปิดแตะ */
/* นิ้ว 👆 กดลงแล้วเด้งกลับทุก ~2.2 วิ — บอกว่า "แตะได้" ให้จอไม่ดูนิ่ง
   transform อย่างเดียว ชิ้นเล็กชิ้นเดียว ไม่มี will-change/เบลอ/เงา (งบ GPU ของกล่อง)
   หน้าบอร์ดถูกถอด src ตอนสไลด์ไม่ขึ้นจอ → ไม่เดินค้างเบื้องหลัง */
.bh .taphint .finger { display: inline-block; transform-origin: 50% 85%; animation: aqTap 2.2s ease-in-out infinite; }
@keyframes aqTap {
  0%, 58%, 100% { transform: translateY(0) scale(1); }
  68%           { transform: translateY(6px) scale(0.86); }
  80%           { transform: translateY(-1px) scale(1.04); }
  90%           { transform: translateY(0) scale(1); }
}
@media (prefers-reduced-motion: reduce) { .bh .taphint .finger { animation: none; } }
.c .nm .s.tight { font-size: 26px; gap: 8px; } .c .nm .s.tight .st, .c .nm .s.tight .sz { font-size: 22px; padding: 1px 10px; }
.c .nm .s.tighter { font-size: 23px; } .c .nm .s.tighter .st, .c .nm .s.tighter .sz { font-size: 20px; padding: 0 8px; }
.st.view { background: #FFD66B; color: #3a2a00; }
.st.talk { background: var(--cyan); color: #06263a; }
.st.int  { background: rgba(255,255,255,0.16); color: #fff; }
.st.done { background: rgba(255,255,255,0.16); color: #fff; }
/* ธง = ชิปมีกรอบ ต่อท้ายขนาด·ชั้น (คำเดิม SUPER/BEST/GOOD/HOT/NEGO… สลับทีละอัน) */
.c .flag { font-size: 22px; font-weight: 800; letter-spacing: 0.08em; padding: 3px 12px; border-radius: 10px; border: 2.5px solid currentColor; line-height: 1.15; transition: opacity 0.4s; }
.c .prw { flex-shrink: 0; min-width: 196px; text-align: right; }
.c .pr { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 70px; line-height: 1; color: var(--bronze); }
.c .pru { font-size: 24px; font-weight: 600; color: rgba(255,255,255,0.82); margin-top: 6px; white-space: nowrap; }
.c .pru b { color: #fff; }
.g { color: var(--green); } .o { color: var(--orange); } .w { color: #fff; }

/* ── Pager — จุดหน้า + ป้ายภาษา อยู่แถวเดียวกันในพื้นที่ปลอดภัย
   (เดิม lang-ind absolute ไปจมใต้ ticker ของ player) ── */
.footrow { position: relative; display: flex; align-items: center; justify-content: center; padding-top: 16px; }
.dots { display: flex; align-items: center; justify-content: center; gap: 14px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.25); transition: all 0.4s; }
.dots i.on { background: var(--cyan); width: 40px; border-radius: 8px; }
.lang-ind { font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; white-space: nowrap; }
.lang-ind b { color: var(--cyan); font-weight: 700; }

/* ห้องมีรูป (เจ้าของส่ง) — รูปซ้อน 3 ใบ + หมุด + ×จำนวน ลอยแบบยกกำลัง · ขอบการ์ดฟ้าอ่อน
   แตะแล้ว player เปิดรูป+รายละเอียดห้อง (26 ต.ค. 2569) */
.c .ph { display: inline-flex; align-items: flex-start; gap: 2px; flex-shrink: 0; }
.c .ph svg { width: 80px; height: 68px; display: block; }
.c .ph b { font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 700; color: var(--cyan); line-height: 1; margin-top: -2px; }
.c.has-ph { border-color: rgba(155,232,255,0.55); }
.fade-page .cards { opacity: 0; }
.cards { transition: opacity 0.4s; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bh">
    <div><div class="m" id="headM"></div><div class="sum" id="headS"></div><div class="taphint" id="headT" hidden></div></div>
    <div class="side"><div class="lang-ind" id="langInd"></div><span class="upd" id="headU"></span></div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="footrow">
    <div class="dots" id="dots"></div>
  </div>
</div>

<script>
/* ── Data — contract เดียวกับ board.html ────────────────────────────────────
 * window.__BOARD__ = { project, mode: "rent"|"sale", dataAsOf, rows: [
 *   { type:"1BED", sqm, floor:"LOW|MID|HIGH", updated, price, remarks:[{text,tone}] } ] }
 * #sim=<urlencoded JSON> = live preview จาก Studio · ไม่มีทั้งคู่ → demo */
const DEMO = { project: "39 BY SANSIRI", mode: "rent", dataAsOf: "2026-08-04", rows: [
  { type:"STUDIO", sqm:30, floor:"LOW",  price:18000, remarks:[{text:"SUPER",tone:"green"}] },
  { type:"1BED",  sqm:29, floor:"LOW",  price:15000, remarks:[{text:"HOT",tone:"orange"},{text:"NEGO",tone:"white"}] },
  { type:"1BED",  sqm:33, floor:"HIGH", price:22000, remarks:[{text:"SUPER",tone:"green"}] },
  { type:"1BED",  sqm:34, floor:"LOW",  price:20000, remarks:[{text:"BEST",tone:"green"}] },
  { type:"2BED",  sqm:55, floor:"HIGH", price:30000, remarks:[{text:"NEGO",tone:"white"}] },
  { type:"2BED",  sqm:66, floor:"MID",  price:32000, remarks:[{text:"BEST",tone:"green"}] },
  { type:"3BED",  sqm:107, floor:"LOW", price:70000, remarks:[{text:"SUPER",tone:"green"}] },
  { type:"STUDIO", sqm:27, floor:"LOW",  price:20000, remarks:[{text:"BEST",tone:"green"}] },
  { type:"STUDIO", sqm:34, floor:"HIGH", price:20000, remarks:[{text:"SUPER",tone:"green"}] },
  { type:"1BED",  sqm:30, floor:"LOW",  price:18000, remarks:[{text:"SUPER",tone:"green"}] },
  { type:"1BED",  sqm:55, floor:"HIGH", price:29000, remarks:[{text:"SUPER",tone:"green"}] },
  { type:"1BED",  sqm:58, floor:"MID",  price:30000, remarks:[{text:"SUPER",tone:"green"}] },
  { type:"2BED",  sqm:54, floor:"HIGH", price:30000, remarks:[{text:"INVESTABLE",tone:"green"},{text:"OWNER",tone:"green"}] },
  { type:"2BED",  sqm:58, floor:"LOW",  price:30000, remarks:[{text:"SUPER",tone:"green"}] },
  { type:"1BED",  sqm:56, floor:"MID",  price:30000, remarks:[{text:"SUPER",tone:"green"}] },
  { type:"2BED",  sqm:55, floor:"HIGH", price:30000, remarks:[{text:"SUPER",tone:"green"}] },
  { type:"2BED",  sqm:67, floor:"LOW",  price:33000, remarks:[{text:"NEGO",tone:"white"}] },
  { type:"3BED",  sqm:120, floor:"MID", price:75000, remarks:[{text:"SUPER",tone:"green"}] },
  { type:"1BED",  sqm:31, floor:"MID",  price:19000, remarks:[{text:"OWNER",tone:"green"}] },
] }
let HASH_DATA = null
if (location.hash.startsWith("#sim=")) {
  try { HASH_DATA = JSON.parse(decodeURIComponent(location.hash.slice(5))) } catch (e) {}
}
const DATA = window.__BOARD__ || HASH_DATA ||
  (new URLSearchParams(location.search).get("demo") === "sale"
    ? { ...DEMO, mode: "sale", rows: DEMO.rows.map(r => ({ ...r, price: Math.round(r.price * 300 / 1e5) * 1e5 })) }
    : DEMO)
const MODE = DATA.mode === "sale" ? "sale" : "rent"

/* ── i18n — หมุน ไทย → EN → 日本語 (ป้ายเท่านั้น ตัวเลข/ธงคงที่) ─────────── */
const L = {
  th: { actTalking: "กำลังคุยกับผู้สนใจอยู่", actViewing: "มีนัดเข้าชมแล้ว", actInterest: "มีคนสนใจ %s ราย", doneLine: "ปิดดีลแล้ว", worth: "คุ้มกว่า %s%", cheaper: "ถูกกว่าค่าเฉลี่ยชั้นนี้ %s%", psqmU: "฿/ตร.ม.", cont: "ต่อ", bedU: "ตรม.", beds: { STUDIO: "สตูดิโอ", "1BED": "1 ห้องนอน", "2BED": "2 ห้องนอน", "3BED": "3 ห้องนอน", "4BED+": "4 นอน+ เพนต์เฮาส์" },
        zones: { LOW: "ชั้นล่าง", MID: "ชั้นกลาง", HIGH: "ชั้นสูง" }, floorWord: "ชั้น",
        chipRent: "ค่าเช่า/เดือน · ฿/MO", rentU: "฿/เดือน",
        chipSaleM: "ราคาขาย · ล้านบาท", chipSaleQ: "ราคาขาย · ฿/ตรม.", saleM: "ล้านบาท", saleQ: "฿/ตรม.", ind: "ไทย" },
  en: { actTalking: "In conversation", actViewing: "Viewing booked", actInterest: "%s people enquired", doneLine: "Closed", worth: "%s% better value", cheaper: "%s% under this floor", psqmU: "THB/sqm", cont: "CONT.", bedU: "sqm", beds: { STUDIO: "Studio", "1BED": "1 Bedroom", "2BED": "2 Bedroom", "3BED": "3 Bedroom", "4BED+": "4 Bed+ Penthouse" },
        zones: { LOW: "Low floor", MID: "Mid floor", HIGH: "High floor" }, floorWord: "Floor",
        chipRent: "Rent per month · ฿/MO", rentU: "฿/mo",
        chipSaleM: "Sale price · ฿ Million", chipSaleQ: "Sale price · ฿/sqm", saleM: "฿ Million", saleQ: "฿/sqm", ind: "EN" },
  ja: { actTalking: "商談中", actViewing: "内見予約あり", actInterest: "%s 件の問い合わせ", doneLine: "成約済み", worth: "%s% お得", cheaper: "この階の平均より %s% 安い", psqmU: "円/㎡", cont: "つづき", bedU: "㎡", beds: { STUDIO: "ワンルーム", "1BED": "1LDK", "2BED": "2LDK", "3BED": "3LDK", "4BED+": "4LDK+ ペントハウス" },
        zones: { LOW: "低層階", MID: "中層階", HIGH: "高層階" }, floorWord: "",
        chipRent: "家賃/月 · ฿/MO", rentU: "฿/月",
        chipSaleM: "販売価格 · 百万฿", chipSaleQ: "販売価格 · ฿/㎡", saleM: "百万฿", saleQ: "฿/㎡", ind: "日本語" },

/* ป้ายชนิดห้องบนพาดหัว = อังกฤษคงที่ ไม่หมุนตามภาษา (เจ้าของสั่ง) — สั้น อ่านเป็นสัญลักษณ์ */
const SEG_LABEL = { STUDIO: "Studio", "1BED": "1 Bed", "2BED": "2 Bed", "3BED": "3 Bed", "4BED+": "4 Bed+" }
/* เรียงตาม segment แล้ว "เกลี่ยหน้าเท่า ๆ กันแบบเดิม" — ไม่ตัดหน้าตาม segment
   เพราะของจริงมี STUDIO/3BED อยู่ segment ละ 1 ห้องแทบทุกบอร์ด ถ้าบังคับให้ขึ้น
   หน้าใหม่ มันจะได้ทั้งหน้าไว้โชว์การ์ดใบเดียวบนจอที่วางไว้ 7 ใบ
   segment จึงถูกสื่อด้วย "หัวคั่น" ไม่ใช่ "ขอบหน้า" · หน้าไหนต่อจาก segment เดิม
   หัวจะบอกว่าต่อเนื่อง คนอ่านไม่หลงว่าขึ้นกลุ่มใหม่ */
const pages = [], pageSegs = []
{
  /* ภายในแต่ละชนิด เรียงตามชั้น: ชั้นสูงอยู่บน ชั้นต่ำอยู่ล่าง (หลายหน้า → หน้า 1 = ชั้นบน)
     ห้องที่ไม่มีเลขชั้นจริง ใช้โซนแทน (ล่าง≈5 · กลาง≈15 · สูง≈25) · ชั้นเท่ากัน → ราคาถูกก่อน */
  const ZONE_FLOOR = { LOW: 5, MID: 15, HIGH: 25 }
  const floorKey = r => r.floorNo != null ? r.floorNo : (ZONE_FLOOR[r.floor] ?? 15)
  const byFloor = list => list.slice().sort((a, b) => floorKey(b) - floorKey(a) || (a.price || 0) - (b.price || 0))
  const sorted = SEG_ORDER.flatMap(sg => byFloor(rows.filter(r => r.type === sg)))
    .concat(byFloor(rows.filter(r => !SEG_ORDER.includes(r.type))))
  const n = sorted.length
  const pageCount = Math.max(1, Math.ceil(n / PER_PAGE))
  const base = Math.floor(n / pageCount), rem = n % pageCount
  let i = 0
  for (let p = 0; p < pageCount; p++) {
    const take = base + (p < rem ? 1 : 0)
    pages.push(sorted.slice(i, i + take)); i += take
  }
  let seen = null
  for (const pg of pages) {
    const segs = []
    pg.forEach((r, idx) => {
      const last = segs[segs.length - 1]
      if (last && last.seg === r.type) { last.n++; return }
      segs.push({ seg: r.type, start: idx, n: 1, cont: r.type === seen })
      seen = r.type
    })
    pageSegs.push(segs)
  }
}

const stageEl = $("stage")

function fitStage() {

  h = Math.max(1400, Math.min(2100, h))                 // หน้าต่างสัดส่วนแปลก ๆ → กลับไป letterbox
  const s = Math.min(innerWidth / 1080, innerHeight / h)
  stageEl.style.height = h + "px"
  stageEl.style.paddingTop = Math.round(h * SAFE_TOP) + "px"
  stageEl.style.paddingBottom = Math.round(h * SAFE_BOT) + "px"
  stageEl.style.transform = `translate(-50%, -50%) scale(${s})`
}
fitStage()
addEventListener("resize", fitStage)

const REC = new URLSearchParams(location.search).get("rec") === "1"
/* ?lang=th|en|ja|zh ปักภาษา (จอจำลองใน Studio) · จอจริงไม่ส่งพารามิเตอร์นี้ → หมุนภาษาต่อรอบตามเดิม */
if (!REC) { const ql = LANGS.indexOf(new URLSearchParams(location.search).get("lang")); lang = ql >= 0 ? ql : nextLang() }
paint()
/* วัดความยาวอีกรอบเมื่อฟอนต์เว็บโหลดเสร็จ — ก่อนหน้านั้นวัดจากฟอนต์สำรองที่แคบกว่า
   (บนกล่องฟอนต์มาทีหลัง → ข้อความล้นแต่ไม่หด) */
try { document.fonts.ready.then(() => { if (!REC) paint() }) } catch (e) {}

/* ── โหมดอัดวิดีโอ (?rec=1) — เดินเวลาจากภายนอกทีละเฟรม แทน setInterval
 *    ให้ recorder เรียก __paintAt(tMs) → ได้วิดีโอ deterministic ลูปพอดีเป๊ะ
 *    v2: หนึ่งรอบ (ทุกหน้า) = ภาษาเดียว → วิดีโอหนึ่งลูป = ทุกหน้า × ทุกภาษา ── */
if (REC) {
  const style = document.createElement("style")
  style.textContent = "* { transition: none !important; }"
  document.head.appendChild(style)
  const ramp = (u, period) => u < 400 ? u / 400 : u > period - 420 ? Math.max(0, (period - u) / 420) : 1
  const ROUND_MS = pages.length * PAGE_MS
  window.__totalMs = ROUND_MS * LANGS.length
  window.__paintAt = t => {
    t = t % window.__totalMs
    page = Math.floor(t / PAGE_MS) % pages.length
    lang = Math.floor(t / ROUND_MS) % LANGS.length
    flagIdx = Math.floor(t / FLAG_MS)
    paint()
    /* การ์ดจางเฉพาะตอนเปลี่ยนหน้า · ธงหลายอันจางตามคลื่นสลับธง — ธงเดี่ยวนิ่ง */
    const aPage = ramp(t % PAGE_MS, PAGE_MS)
    document.getElementById("cards").style.opacity = aPage
    const aFlag = Math.min(aPage, ramp(t % FLAG_MS, FLAG_MS))
    document.querySelectorAll('#cards .flag[data-n]').forEach(el => {
      if (+el.dataset.n > 1) el.style.opacity = aFlag
    })
  }
}

/* เปลี่ยนหน้า — ภาษาคงเดิมทั้งรอบ */
if (!REC && pages.length > 1) setInterval(() => {
  if (window.__boardHold) return
  document.body.classList.add("fade-page")
  setTimeout(() => {
    page = (page + 1) % pages.length
    paint()
    document.body.classList.remove("fade-page")
  }, 420)
}, PAGE_MS)
/* คลื่นสลับธง — เฉพาะการ์ดที่มีหลายธง (ธงเดี่ยวไม่กะพริบ) */
if (!REC) setInterval(() => {
  const multi = [...document.querySelectorAll('#cards .flag[data-n]')].filter(el => +el.dataset.n > 1)
  if (!multi.length) { flagIdx++; return }
  multi.forEach(el => el.style.opacity = 0)
  setTimeout(() => {
    flagIdx++
    const cs = document.querySelectorAll('#cards .c')
    pages[page].forEach((r, i) => {
      const rm = r.takenLabel ? [] : (r.remarks || []).slice(0, 4)
      if (rm.length < 2 || !cs[i]) return
      const cur = rm[flagIdx % rm.length]
      const span = cs[i].querySelector('.flag')
      if (span) { span.textContent = cur.text; span.className = "flag " + (TONE[cur.tone] || 'w'); span.style.opacity = '' }
    })
  }, 420)
}, FLAG_MS)
</script>
</body>
</html>
