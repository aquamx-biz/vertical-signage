<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Board Preview · เหมือนบนจอจริง</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700;800&family=IBM+Plex+Sans+Thai:wght@500;600;700&family=IBM+Plex+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* จำลองจอจริง 1080×1920 + ของที่ player วางทับ — พิกัด/สไตล์วัดจาก player จริง
   (lumpini-24.netlify.app ที่ 1080×1920 · 12 ต.ค. 2569 ขณะสไลด์บอร์ดขึ้น):
   แถบบน .topbar 0–135 · ช่องสไลด์ (iframe บอร์ด) 135–1843 = 1080×1708
   ปุ่มเมนู .menu-btn.slim 48,177–168,283 · ชิปหมวด .slot-eyebrow ชิดขวาที่ x 1013 · y 188–266
   ปุ่ม CTA .cta-primary 60,1658–539,1768 · ticker .bottombar 1843–1920
   (ของเดิมวาดโลโก้ aquamx ทับมุมขวาบน + วางบอร์ดเต็ม 1920 — จอจริงไม่มีโลโก้ และบอร์ดอยู่ในช่อง 1708)
   player เปลี่ยนตำแหน่งเมื่อไร ต้องวัดใหม่แล้วแก้ตรงนี้ */
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; background: #1A2332; display: flex; align-items: center; justify-content: center; font-family: Anuphan, 'IBM Plex Sans Thai', sans-serif; padding: 16px; }
.stage { position: relative; width: 1080px; height: 1920px; transform-origin: center; overflow: hidden; border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.5); background: #060B14; flex-shrink: 0; }
.stage iframe { position: absolute; left: 0; top: 135px; width: 1080px; height: 1708px; border: 0; display: block; }
.chrome { position: absolute; inset: 0; z-index: 3; pointer-events: none; color: #fff; }
.topbar { position: absolute; left: 0; right: 0; top: 0; height: 135px; background: rgb(14,29,58); display: flex; align-items: center; justify-content: space-between; padding: 0 56px; }
.topbar .l { display: flex; align-items: center; gap: 18px; font-size: 38px; font-weight: 800; letter-spacing: .02em; }
.topbar .l .sep { opacity: .55; font-weight: 600; }
.topbar .l .tm { font-weight: 700; }
.topbar .dot { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: #6DD5E8; transform: translate(-50%,-50%); }
.topbar .r { font-size: 30px; font-weight: 600; opacity: .92; display: flex; align-items: center; gap: 14px; }
.topbar .r b { font-weight: 800; }
.menu { position: absolute; left: 48px; top: 177px; width: 120px; height: 106px; border-radius: 96px; background: rgba(8,12,22,.35); border: 2.5px solid rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center; }
.menu i { display: block; width: 40px; height: 4px; border-radius: 2px; background: #fff; box-shadow: 0 -12px 0 #fff, 0 12px 0 #fff; }
.menu::after { content: ''; position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #6DD5E8; }
.eyebrow { position: absolute; right: 67px; top: 188px; height: 78px; padding: 0 30px; border-radius: 96px; background: rgba(8,12,22,.35); border: 2.5px solid rgba(255,255,255,.4); display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 600; letter-spacing: .3em; }
.eyebrow::before { content: ''; width: 13px; height: 13px; border-radius: 50%; background: rgb(109,213,232); }
.eyebrow::after { content: '›'; font-size: 32px; letter-spacing: 0; opacity: .8; }
.cta { position: absolute; left: 60px; top: 1658px; width: 479px; height: 110px; border-radius: 23px; background: rgba(8,12,22,.55); border: 2.5px solid rgba(255,255,255,.32); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; font-size: 30px; font-weight: 700; letter-spacing: 5px; }
.bottombar { position: absolute; left: 0; right: 0; top: 1843px; height: 77px; background: rgb(14,29,58); display: flex; align-items: center; gap: 40px; padding: 0 30px; white-space: nowrap; overflow: hidden; font-size: 26px; font-weight: 700; letter-spacing: .14em; opacity: .95; }
.bottombar i { font-style: normal; color: #6DD5E8; }
.tag { position: fixed; top: 10px; left: 14px; color: #8fa0b8; font-size: 13px; z-index: 9; font-family: Anuphan, 'IBM Plex Sans Thai', sans-serif; }
.tag b { color: #fff; }
</style>
</head>
<body>
<div class="tag">Preview · <b>หน้าตาเดียวกับจอจริง</b> — บอร์ดอยู่ในช่องสไลด์ของ player + แถบบน / ปุ่มเมนู / ชิปเช่า-ขาย / ปุ่ม CTA / ticker ตามตำแหน่งที่วัดจาก player</div>
<div class="stage" id="stage">
  <iframe id="fr" title="board"></iframe>
  <div class="chrome">
    <div class="topbar"><div class="l"><span id="pj">AQUAMX</span><span class="sep">·</span><span class="tm" id="clock"></span></div><span class="dot"></span><div class="r">⛅ <b>32°</b> Bangkok</div></div>
    <div class="menu"><i></i></div>
    <div class="eyebrow" id="chip">เช่า</div>
    <div class="cta"><span>FIND YOUR UNIT</span><span>→</span></div>
    <div class="bottombar">ข่าวและข้อความวิ่งของ player อยู่แถบนี้ <i>·</i> NEWS TICKER RUNS HERE <i>·</i> ข่าวและข้อความวิ่งของ player อยู่แถบนี้</div>
  </div>
</div>
<script>
const P = new URLSearchParams(location.search)
/* tpl=cards → บอร์ดการ์ดที่ทุกตึกใช้อยู่ (v2) · tpl=cards-v1 → แบบเก่า (ตึกใน CARDS_V1) · tpl=flap → split-flap */
const tpl = P.get('tpl') === 'flap' ? 'board.html' : P.get('tpl') === 'cards-v1' ? 'board-cards.html' : 'board-cards-v2.html'
document.getElementById('fr').src = './' + tpl + location.hash
try {
  const sim = JSON.parse(decodeURIComponent(location.hash.slice(5)))
  if (sim.project) document.getElementById('pj').textContent = sim.project
  if (sim.mode) document.getElementById('chip').textContent = sim.mode === 'sale' ? 'ขาย' : 'เช่า'
} catch (e) {}
const tick = () => document.getElementById('clock').textContent =
  new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
tick(); setInterval(tick, 30000)
function fit() {
  const s = Math.min((innerWidth - 32) / 1080, (innerHeight - 32) / 1920)
  document.getElementById('stage').style.transform = `scale(${s})`
  document.body.style.height = Math.max(innerHeight, 1920 * s + 32) + 'px'
}
fit(); addEventListener('resize', fit)
</script>
</body>
</html>
